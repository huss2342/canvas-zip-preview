name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check background.js
      - run: node --check content.js
      - run: node --check zip-reader.js
      - run: node --check store/demo.js
      - run: npm run build:release
